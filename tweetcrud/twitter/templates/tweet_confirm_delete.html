{% extends "layout.html" %}

{% block title %}
Delete Tweet
{% endblock %}

{% block content %}
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card bg-dark border-danger shadow">
        <div class="card-body">

          <h4 class="text-danger mb-3">Confirm Delete</h4>

          <p>
            Are you sure you want to delete this tweet?
            <strong>This action cannot be undone.</strong>
          </p>

          <div class="border border-secondary rounded p-3 mb-4">
            <p class="mb-1 text-muted">
              <strong>@{{ tweet.user.username }}</strong>
            </p>
            <p class="mb-0">{{ tweet.text }}</p>
          </div>

          <form method="post">
            {% csrf_token %}

            <div class="d-flex justify-content-between">
              <a href="{% url 'tweet_list' %}" class="btn btn-secondary">
                Cancel
              </a>

              <button type="submit" class="btn btn-danger">
                Delete
              </button>
            </div>
          </form>

        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
